name: Supabase keep-alive

# Keeps the free-tier Supabase project from pausing.
#
# Supabase pauses Free projects that show "low activity" over 7 days and
# says "a few user requests to the database each day" is typically enough.
# One request a day turned out NOT to be enough, so this runs every 6 hours
# and makes a write + a read each time (8 requests/day).
#
# Minute 17 instead of 0: GitHub delays and sometimes drops scheduled runs
# at the top of the hour because everyone schedules there.

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Heartbeat write + read
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          # --- Write ---
          HTTP_STATUS=$(curl -s -o /tmp/write.json -w "%{http_code}" \
            -X PATCH \
            "${SUPABASE_URL}/rest/v1/heartbeat?id=eq.1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d '{"last_ping_at": "now()"}')

          echo "Write status: ${HTTP_STATUS}"
          cat /tmp/write.json; echo ""

          if [ "${HTTP_STATUS}" -lt 200 ] || [ "${HTTP_STATUS}" -ge 300 ]; then
            echo "::error::Write failed with status ${HTTP_STATUS}."
            exit 1
          fi

          # A 200 with [] means zero rows were updated (RLS or missing row).
          if [ "$(cat /tmp/write.json)" = "[]" ]; then
            echo "::error::Write returned 200 but updated zero rows."
            exit 1
          fi

          # --- Read ---
          HTTP_STATUS=$(curl -s -o /tmp/read.json -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/heartbeat?select=id,last_ping_at" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "Read status: ${HTTP_STATUS}"
          cat /tmp/read.json; echo ""

          if [ "${HTTP_STATUS}" -lt 200 ] || [ "${HTTP_STATUS}" -ge 300 ]; then
            echo "::error::Read failed with status ${HTTP_STATUS}."
            exit 1
          fi

          echo "Keep-alive OK."
